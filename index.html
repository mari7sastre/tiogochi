<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#5b9097">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tiogochi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Tiogochi</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Pla: una consola-ou nevada amb la pantalla al centre; a sota, targetes per entrar, el problema del dia, el butlletí i el diari. Una sola columna de mòbil. */
:root{
  --bg:#e8f0ee; --ink:#1c2a27; --muted:#566a65; --card:#ffffff; --line:#cfdcd8;
  --shell:#5b9097; --shell-hi:#8cbcc2; --shell-deep:#2f5b62; --bezel:#2c565d;
  --btn:#cf4a3f; --btn-deep:#96302a; --strip:#f3ead2; --screen:#d8ebe6; --night:#22344a;
  --pine:#1f6b4f; --gold:#e3a626; --red:#c7372c; --snow:#ffffff; --ok:#1f7a4f; --bad:#b3362c;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a18; --ink:#e8f0ec; --muted:#9ab0a9; --card:#182623; --line:#2b3f3a;
    --pine:#78c9a6; --ok:#6fd3a0; --bad:#ff8a7a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a18; --ink:#e8f0ec; --muted:#9ab0a9; --card:#182623; --line:#2b3f3a;
  --pine:#78c9a6; --ok:#6fd3a0; --bad:#ff8a7a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;font-variant-ligatures:none;font-feature-settings:"locl" 0}
#app{max-width:440px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:600;font-size:40px;line-height:1;margin:0}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 10px}
.sub{margin:6px 0 0;color:var(--muted);font-size:15px}
.sub b{color:var(--ink)}
.slogan{margin:-4px 0 0;font-size:15px;color:var(--pine);font-weight:700;text-align:center;text-wrap:balance}
.padrins{margin:-8px 0 0;text-align:center;font-size:14px;color:var(--muted)}
.padrins b{color:var(--ink)}
.tag{font-size:12px;font-weight:700;color:var(--pine);margin-left:6px}
.warn{display:block;width:100%;margin-top:10px;font:inherit;font-weight:700;font-size:14px;color:#7a1f18;background:#fde3df;border:1.5px solid #e8a39a;border-radius:12px;padding:9px 12px;cursor:pointer;text-align:left}
.warn[hidden]{display:none}
.count{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.count .num{font-family:var(--display);font-weight:600;font-size:46px;line-height:1;color:var(--red);min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
.count .txt{font-size:15px;line-height:1.3}
.count .txt b{display:block;font-family:var(--display);font-weight:600;font-size:18px}

/* Consola */
.egg{position:relative;width:min(340px,100%);aspect-ratio:34/45;margin:6px auto 0;border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;overflow:hidden;
  background:radial-gradient(ellipse 60% 40% at 32% 28%,var(--shell-hi),transparent 70%),linear-gradient(170deg,var(--shell),var(--shell-deep));
  box-shadow:inset -10px -18px 28px rgba(0,0,0,.25),inset 8px 10px 20px rgba(255,255,255,.18),0 14px 28px rgba(0,0,0,.22);
  display:flex;flex-direction:column;align-items:center;padding-top:24px}
.egg::before{content:"";position:absolute;left:-14%;right:-14%;top:-22%;height:36%;border-radius:50%;background:var(--snow);box-shadow:inset 0 -6px 10px rgba(120,160,170,.25)}
.egg>*{position:relative}
.dots{position:absolute;inset:0;pointer-events:none}
.dots i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.85}
.dots b{position:absolute;width:9px;height:9px;background:#f6e7a8;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.logo{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:5px;color:var(--bezel);margin:0 0 6px}
.bezel{width:70%;background:var(--strip);border:3px solid var(--bezel);border-radius:20px;padding:5px 7px 7px;box-shadow:inset 0 2px 0 rgba(255,255,255,.6)}
.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-bottom:5px}
.ico{background:none;border:2px solid transparent;border-radius:9px;padding:2px 0;cursor:pointer;display:flex;justify-content:center;color:#3a3a2e}
.ico svg{width:21px;height:21px}
.game{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
.ico.sel{border-color:var(--bezel);background:#fff}
.screen{position:relative;border-radius:10px;overflow:hidden;background:var(--screen);border:2px solid #9fb3a8}
.screen.night{background:var(--night)}
.screen{aspect-ratio:320/264}
.lcd{position:absolute;inset:0;background:#cfd8b4;background-image:linear-gradient(rgba(60,80,50,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(60,80,50,.06) 1px,transparent 1px);background-size:3px 3px;
  color:#26301f;font-family:var(--display);padding:7px 9px;display:flex;flex-direction:column;gap:5px}
.lcd .hd{display:flex;justify-content:space-between;font-size:11.5px;border-bottom:2px solid #26301f;padding-bottom:3px}
.lcd .g{display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;flex:1}
.lcd .g div{font-size:10.5px;line-height:1.1}
.lcd .g b{display:block;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.lcd .ch{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;padding-top:4px}
.lcd .ch div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;gap:2px}
.lcd .ch i{display:block;width:100%;background:#26301f;min-height:2px}
.lcd .ch .today i{background:#c7372c}
.lcd .rc{flex:1;font-size:13px;line-height:1.25;display:flex;align-items:center;text-align:center}
.lcd .ft{font-size:10px;text-align:center;opacity:.75}
.lcd .qq{flex:1;overflow:auto;font-size:12px;line-height:1.25}
.lcd .qq p{margin:0}
.lcd .op{display:grid;gap:4px;flex:1;align-content:start}
.lcd .op button{font:inherit;font-size:12px;text-align:left;color:#26301f;background:none;border:2px solid transparent;border-radius:6px;padding:3px 5px;cursor:pointer}
.lcd .op button.sel{border-color:#26301f}
.lcd .op button.ok{background:#26301f;color:#cfd8b4}
.lcd .op button.no{text-decoration:line-through}
.lcd .big{font-size:15px;font-weight:600;margin:0 0 3px}
.screen svg.tio{display:block;width:100%;height:auto}
.bubble{position:absolute;left:6px;right:6px;top:5px;font-family:var(--display);font-size:13.5px;line-height:1.15;color:var(--ink);text-align:center;text-wrap:balance}
.night .bubble{color:#f6eecb}
.lvl{position:absolute;right:6px;bottom:4px;font-family:var(--display);font-size:11px;color:#3a4a46;background:rgba(255,255,255,.7);border-radius:6px;padding:0 5px}
.flake{position:absolute;top:-6px;width:4px;height:4px;background:var(--snow);border-radius:50%;opacity:.9;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(240px)}}
.food{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:4px;background:rgba(243,234,210,.95);border-top:2px solid #9fb3a8}
.fd{background:none;border:2px solid transparent;border-radius:8px;padding:1px 0 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;font:inherit;font-size:9.5px;font-weight:800;color:#2a1a12;line-height:1.1}
.fd svg{width:26px;height:26px}
.fd.sel{border-color:var(--bezel);background:#fff}
.bars{display:grid;grid-template-columns:auto 1fr;gap:3px 6px;align-items:center;margin-top:5px;font-family:var(--display);font-size:12px;color:#3a3a2e}
.bar{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.bar i{height:8px;border-radius:2px;background:rgba(60,60,40,.18)}
.bar i.on{background:var(--gold)}
.bar.low i.on{background:#e8604f}
.bite{position:absolute;left:10%;top:52%;width:40px;height:40px;animation:bite 1.3s ease-in forwards}
.bite svg{width:40px;height:40px}
@keyframes bite{0%{transform:translate(-70px,-50px) scale(1.3)}70%{transform:translate(0,0) scale(1)}100%{transform:scale(0);opacity:0}}
.notes{position:absolute;left:8%;top:30%;font-family:var(--display);font-size:22px;color:var(--pine);animation:notes 1.6s ease-out forwards}
@keyframes notes{from{transform:translateY(20px);opacity:0}30%{opacity:1}to{transform:translateY(-30px);opacity:0}}
.munch{animation:munch .35s ease-in-out 3;transform-origin:50% 90%}
@keyframes munch{50%{transform:translateY(-4px) rotate(-1.5deg)}}
.whack{animation:whack .3s ease-in-out;transform-origin:50% 90%}
@keyframes whack{50%{transform:translateY(6px) scaleY(.95)}}
.keys{display:flex;gap:26px;margin-top:10px;align-items:flex-start}
.key{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer;font-family:var(--display);font-size:12px;color:#f3f7f6}
.key i{display:block;width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f07a6f,var(--btn) 55%,var(--btn-deep));box-shadow:0 4px 0 var(--btn-deep),0 6px 8px rgba(0,0,0,.3)}
.key:active i{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-deep),0 2px 4px rgba(0,0,0,.3)}
.key:nth-child(2){margin-top:8px}
.key.off span{opacity:.35}
.senyera{display:flex;gap:2px;margin-top:8px}
.senyera span{width:12px;height:5px;background:#f2c23a}
.senyera span:nth-child(even){background:#c7372c}

/* Targetes */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.note{margin:8px 0 0;font-size:14px;color:var(--muted)}
.mode{font-size:13px;color:var(--muted);text-align:center;margin:0}
label{display:block;font-weight:600;font-size:14px;margin:0 0 5px}
select,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px}
.row{display:flex;gap:8px;margin-top:10px}
.btn{font:inherit;font-weight:800;color:#fff;background:var(--btn);border:0;border-bottom:4px solid var(--btn-deep);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.ghost{font:inherit;font-weight:600;color:var(--pine);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.err{color:var(--bad);font-size:14px;margin:6px 0 0}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{font:inherit;text-align:left;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.opt:disabled{cursor:default;opacity:1}
.qt{font-family:var(--display);font-size:13px;color:var(--pine);margin:0 0 4px;letter-spacing:.5px}
.q{margin:0;font-weight:600}
.res{margin:10px 0 0;font-size:15px}
.bul{border:2px solid var(--ink);border-radius:12px;padding:12px}
.bul .hd{font-family:var(--display);font-size:13px;letter-spacing:1px;margin:0;border-bottom:2px solid var(--ink);padding-bottom:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.stat span{display:block;font-size:12.5px;color:var(--muted)}
.stat b{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.rec{margin:0;font-size:14px;font-style:italic}
.secret{border:2px dashed var(--red);border-radius:12px;padding:12px;margin-top:10px}
.secret .who{font-family:var(--display);font-size:22px;margin:0}
.secret p{margin:6px 0 0;white-space:pre-line}
ol,ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{display:flex;justify-content:space-between;gap:10px;font-size:15px}
li .n{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.rank li:first-child span:first-child::after{content:" · padrí del Tió";color:var(--pine);font-weight:700}
.diary li{justify-content:flex-start;gap:8px;align-items:flex-start}
.diary li .n{margin-left:auto}
.gifts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0}
.gifts svg{width:34px;height:34px;animation:pop .5s ease-out both}
@keyframes pop{from{transform:translateY(-30px) scale(0);opacity:0}}
.diploma{border:4px double var(--gold);border-radius:12px;padding:16px;text-align:center}
.diploma h3{font-family:var(--display);font-size:24px;margin:0 0 6px}
.diploma p{margin:6px 0 0}
.foot{font-size:14px;color:var(--muted);text-align:center;margin:0}
.foot a{color:var(--pine);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.flake,.bite,.munch,.whack,.gifts svg,.notes{animation:none}.bite,.notes{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// Problemes del dia: del 26 de novembre (índex 0) al 10 de desembre (índex 14). "a" és l'índex de la resposta correcta.
var PREGUNTES=[
 {t:'Incidència de gana',q:'A les 9 h, cap dels 28 alumnes del màster té gana. A les 11 h, 7 ja en tenen. Quina és la incidència acumulada de gana en aquestes dues hores?',o:['7%','25%','28%','33%'],a:1,e:'Casos nous / població a risc al començament: 7/28 = 25%.'},
 {t:'Prevalença d\'indigestió',q:'Al dinar de Sant Esteve hi ha 50 convidats. Ara mateix, 12 tenen indigestió de canelons. Quina és la prevalença puntual?',o:['12%','24%','38%','50%'],a:1,e:'Casos existents en un moment / població total: 12/50 = 24%. Compta tots els casos, nous i antics.'},
 {t:'Torró dur i queixals',q:'En una cohort, 40 de 100 persones que mengen torró dur tenen mal de queixal, i 10 de 100 que mengen torró tou. Quin és el risc relatiu?',o:['0,25','3','4','30'],a:2,e:'RR = 0,40 / 0,10 = 4. Qui menja torró dur té 4 vegades més risc de mal de queixal.'},
 {t:'El bastó funciona?',q:'Dels tions colpejats amb bastó, el 60% caguen regals; dels que no, només el 20%. Quina és la diferència de riscos?',o:['3','40 punts percentuals','60%','80%'],a:1,e:'Diferència de riscos = 60% − 20% = 40 punts percentuals. El quocient (3) seria el RR.'},
 {t:'Tions esquerdats',q:'Estudi cas-control. Tions esquerdats (casos): 30 molt colpejats i 10 poc. Tions sencers (controls): 20 molt colpejats i 40 poc. Quina és l\'odds ratio?',o:['1,5','3','6','12'],a:2,e:'OR = (30 × 40) / (10 × 20) = 1.200 / 200 = 6.'},
 {t:'Brot al sopar d\'empresa',q:'Dels que van menjar canelons, 30 de 40 es van posar malalts; dels que no, 5 de 40. Dels que van menjar torró, 18 de 40; dels que no, 17 de 40. Quin aliment és el sospitós?',o:['Canelons','Torró','Tots dos igual','Cap'],a:0,e:'Taxa d\'atac amb canelons 75% vs 12,5% sense. Amb torró 45% vs 42,5%: gairebé no hi ha diferència.'},
 {t:'Detector de regals',q:'Un detector de regals es prova en 50 tions que sí que en porten a dins: dona positiu en 45. Quina és la sensibilitat?',o:['10%','45%','90%','100%'],a:2,e:'Sensibilitat = VP / (VP + FN) = 45/50 = 90%.'},
 {t:'Tions buits',q:'El mateix detector es prova en 100 tions buits: dona negatiu en 80. Quina és l\'especificitat?',o:['20%','80%','90%','100%'],a:1,e:'Especificitat = VN / (VN + FP) = 80/100 = 80%.'},
 {t:'Positiu: hi ha regal?',q:'El detector dona 60 positius: 45 són tions amb regal i 15 són tions buits. Quin és el valor predictiu positiu?',o:['25%','45%','75%','90%'],a:2,e:'VPP = VP / (VP + FP) = 45/60 = 75%.'},
 {t:'La manta salva tions',q:'Sense manta, el 30% dels tions es refreden; amb manta, el 10%. Quants tions cal tapar perquè un no es refredi (NNT)?',o:['2','5','10','20'],a:1,e:'Reducció absoluta del risc = 30% − 10% = 20%. NNT = 1 / 0,20 = 5.'},
 {t:'Grip dels tions',q:'La grip dels tions té una R0 de 5. Quin percentatge de tions cal immunitzar per assolir la immunitat de grup?',o:['20%','50%','80%','95%'],a:2,e:'Llindar = 1 − 1/R0 = 1 − 1/5 = 80%.'},
 {t:'Troncs tallats',q:'Se segueixen 10 tions durant 20 dies cadascun i n\'acaben tallats 4 per fer llenya. Quina és la taxa d\'incidència?',o:['0,4 per 100 tió-dies','2 per 100 tió-dies','4 per 100 tió-dies','20 per 100 tió-dies'],a:1,e:'4 casos / (10 × 20) tió-dies = 4/200 = 2 per 100 tió-dies.'},
 {t:'Cantar ajuda?',q:'Les famílies que canten més nadales aconsegueixen més regals del Tió, però també són les que li donen més menjar. Què és el menjar en aquesta associació?',o:['Un factor de confusió','Un modificador de l\'efecte','Un biaix de memòria','La variable resultat'],a:0,e:'El menjar s\'associa amb cantar i, independentment, amb els regals: és un factor de confusió.'},
 {t:'Recordar el menjar',q:'Les famílies amb un Tió que no ha cagat res recorden amb molt detall què li van donar; les altres no s\'hi fixen tant. Quin biaix és?',o:['Biaix de selecció','Biaix de memòria','Confusió','Error aleatori'],a:1,e:'Els casos recorden l\'exposició diferent que els controls: biaix de memòria (record).'},

  function quizHtml(){
    var hd=function(t){return '<div class="hd"><span>'+t+'</span><span>'+(quizPage+1)+'/3</span></div>';};
    var qi=qIndex(), Q=PREGUNTES[qi], mq=myQuiz(), d=dayKey(Date.now());
    if(quizPage===0) return '<div class="lcd">'+hd('PROBLEMA '+(qi+1)+'/15')+'<div class="qq"><p class="big">'+esc(Q.t)+'</p><p>'+esc(Q.q)+'</p></div><div class="ft">B: veure les opcions</div></div>';
    if(quizPage===1) return '<div class="lcd">'+hd('OPCIONS')+'<div class="op">'+Q.o.map(function(o,i){
        var c=mq?(i===Q.a?'ok':(i===mq.c&&mq.v!=='1'?'no':'')):(i===quizSel?'sel':'');
        return '<button type="button" data-q="'+i+'" class="'+c+'">'+'ABCD'[i]+') '+esc(o)+'</button>';}).join('')+'</div>'+
        '<div class="ft">'+(mq?'Ja has respost. Mira la solució.':!me?'Entra per respondre.':'Només tens un intent')+'</div></div>';
    var all=EV.filter(function(e){return e.k==='quiz'&&dayKey(e.t)===d;}), ok=all.filter(function(e){return e.v==='1';}).length;
    if(!mq) return '<div class="lcd">'+hd('SOLUCIÓ')+'<div class="qq" style="display:flex;align-items:center;text-align:center"><p>Primer respon el problema. La solució surt després.</p></div><div class="ft">Avui l’han respost '+all.length+'</div></div>';
    return '<div class="lcd">'+hd('SOLUCIÓ')+'<div class="qq"><p class="big">'+(mq.v==='1'?'Correcte! +1 ració extra':'Gairebé!')+'</p><p>Resposta: '+esc(Q.o[Q.a])+'</p><p style="margin-top:4px">'+esc(Q.e)+'</p></div>'+
      '<div class="ft">Encert de la classe: '+(all.length?Math.round(ok*100/all.length)+'%':'–')+' ('+all.length+')</div></div>';
  }

  function bulHtml(s){
    var d=dayKey(Date.now()), since=Date.now()-24*36e5, fedToday={}, active={};
    EV.forEach(function(e){if(e.k==='feed'&&dayKey(e.t)===d)fedToday[e.who]=1; if(e.t>since)active[e.who]=1;});
    var q=EV.filter(function(e){return e.k==='quiz'&&dayKey(e.t)===d;}), qok=q.filter(function(e){return e.v==='1';}).length;
    var date=new Date().toLocaleDateString('ca-ES',{timeZone:TZ,day:'numeric',month:'short'});
    var hd='<div class="hd"><span>'+['BUTLLETÍ EPIDEMIOLÒGIC','RACIONS PER DIA','SALUT PÚBLICA'][bulPage]+'</span><span>'+(bulPage+1)+'/3</span></div>', body;
    if(bulPage===0){
      body='<div class="g"><div>Risc de gana<b>'+(s.p<25?'ALT':s.p<50?'MODERAT':'BAIX')+'</b></div>'+
        '<div>Cobertura avui<b>'+Math.round(Object.keys(fedToday).length*100/NAMES.length)+'%</b></div>'+
        '<div>Cuidadors 24 h<b>'+Object.keys(active).length+'</b></div>'+
        '<div>Estat de salut<b>'+(health().sick?'COSTIPAT':health().fallen?'DESTAPAT':'SA')+'</b></div></div>'+
        '<div class="ft">Agència de Salut Pública del Tió · '+date+'</div>';
    } else if(bulPage===1){
      var days=[],mx=1;
      for(var i=6;i>=0;i--){var k=dayKey(Date.now()-i*864e5),c=EV.filter(function(e){return e.k==='feed'&&dayKey(e.t)===k;}).length;days.push({k:k,c:c});mx=Math.max(mx,c);}
      body='<div class="ch">'+days.map(function(x,i){return '<div class="'+(i===6?'today':'')+'"><span>'+x.c+'</span><i style="height:'+Math.round(x.c*100/mx*0.62)+'%"></i><span>'+(+x.k.slice(8))+'</span></div>';}).join('')+'</div>'+
        '<div class="ft">Mandarines: '+EV.filter(function(e){return e.k==='feed'&&e.v==='mandarina';}).length+' · Total: '+EV.filter(function(e){return e.k==='feed';}).length+'</div>';
    } else {
      var di=Math.max(0,Math.round((Date.parse(d)-Date.parse(FIRSTQ))/864e5));
      body='<div class="rc">'+esc(RECS[di%RECS.length])+'</div><div class="ft">Recomanació del dia</div>';
    }
    return '<div class="lcd">'+hd+body+'</div>';
  }

  function renderBul(s){
    var el=document.getElementById('bul'), d=dayKey(Date.now()), since=Date.now()-24*36e5;
    var fedToday={}, active={}; EV.forEach(function(e){if(e.k==='feed'&&dayKey(e.t)===d)fedToday[e.who]=1; if(e.t>since)active[e.who]=1;});
    var mand=EV.filter(function(e){return e.k==='feed'&&e.v==='mandarina';}).length;
    var q=EV.filter(function(e){return e.k==='quiz'&&dayKey(e.t)===d;}), qok=q.filter(function(e){return e.v==='1';}).length;
    var risk=s.p<25?'Alt':s.p<50?'Moderat':'Baix';
    var di=Math.max(0,Math.round((Date.parse(d)-Date.parse(FIRSTQ))/864e5));
    el.innerHTML='<h2>Butlletí epidemiològic</h2><div class="bul"><p class="hd">AGÈNCIA DE SALUT PÚBLICA DEL TIÓ · '+new Date().toLocaleDateString('ca-ES',{timeZone:TZ,day:'numeric',month:'long'})+'</p>'+
      '<div class="stats"><div class="stat"><span>Risc de gana</span><b>'+risk+'</b></div>'+
      '<div class="stat"><span>Cobertura alimentària avui</span><b>'+Math.round(Object.keys(fedToday).length*100/NAMES.length)+'%</b></div>'+
      '<div class="stat"><span>Cuidadors actius (24 h)</span><b>'+Object.keys(active).length+'</b></div>'+
      '<div class="stat"><span>Mandarines consumides</span><b>'+mand+'</b></div>'+
      '<div class="stat"><span>Encert del problema d’avui</span><b>'+(q.length?Math.round(qok*100/q.length)+'%':'–')+'</b></div>'+
      '<div class="stat"><span>Racions totals</span><b>'+EV.filter(function(e){return e.k==='feed';}).length+'</b></div></div>'+
      '<p class="rec">Recomanació de salut pública: '+esc(RECS[di%RECS.length])+'</p></div>';
  }

  function renderAmi(){
    var el=document.getElementById('ami');
    if(!me||!secret){el.hidden=true;return;} el.hidden=false;
    el.innerHTML='<h2>El teu amic invisible</h2><p style="margin:0">Es secret. Mira-ho quan ningú et vegi.</p>'+
      '<div class="row"><button class="btn" type="button" id="rev">'+(reveal?'Amaga-ho':'Mostra a qui li fas el regal')+'</button></div>'+
      (reveal?'<div class="secret"><p class="who">'+esc(secret.to)+'</p><p><b>Què li agrada:</b> '+esc(secret.pref||'No ha donat pistes. Sorprèn-lo!')+'</p></div>':'');
    document.getElementById('rev').onclick=function(){reveal=!reveal;renderAmi();};
  }

  function renderFin(s){
    var el=document.getElementById('fin');
    if(!isFin()){el.hidden=true;return;} el.hidden=false;
    var feeds=EV.filter(function(e){return e.k==='feed';}).length, songs=EV.filter(function(e){return e.k==='sing';}).length,
        oks=EV.filter(function(e){return e.k==='quiz'&&e.v==='1';}).length, ppl={}; EV.forEach(function(e){ppl[e.who]=1;});
    var names=Object.keys(ppl).map(function(n){return SHORT[n]||n;}).sort(function(a,b){return a.localeCompare(b,'ca');});
    if(hits<3){el.innerHTML='<h2>Fer cagar el Tió</h2><p style="margin:0">Avui és el dia. Doneu-li tres cops de bastó amb els botons de la consola i canteu: <i>Caga tió, ametlles i torró…</i></p><p class="note">Cops: '+hits+'/3</p>';return;}
    var g='';for(var i=0;i<18;i++)g+=GIFTS[i%GIFTS.length].replace('<svg ','<svg style="animation-delay:'+(i*60)+'ms" ');
    el.innerHTML='<div class="gifts">'+g+'</div><div class="diploma"><h3>Hem criat un Tió entre tots</h3>'+
      '<p>Del 26 de novembre a l’11 de desembre de 2026, el màster de Salut Pública li ha donat <b>'+feeds+(feeds===1?' ració':' racions')+'</b>, li ha cantat <b>'+songs+(songs===1?' cop':' cops')+'</b> i ha resolt <b>'+oks+(oks===1?' problema':' problemes')+' d’epidemiologia</b>.</p>'+
      '<p class="note">'+(names.length?'Cuidadors: '+esc(names.join(', '))+'.':'')+'</p></div>';
  }

  function renderRecs(){
    var best={}; EV.forEach(function(e){if(e.k==='game'){var v=+e.v||0; if(!best[e.who]||v>best[e.who])best[e.who]=v;}});
    var o=Object.keys(best).map(function(w){return {n:SHORT[w]||w,v:best[w]};}).sort(function(a,b){return b.v-a.v;}).slice(0,6);
    document.getElementById('recs').innerHTML=o.length?'<ol>'+o.map(function(x,i){return '<li><span>'+(i+1)+'. '+esc(x.n)+'</span><span class="n">'+x.v+(x.v===1?' mandarina':' mandarines')+'</span></li>';}).join('')+'</ol>':
      '<p style="margin:0;color:var(--muted)">Encara no hi ha rècords. Prova el joc des del menú de la consola.</p>';
  }

  function renderLists(){ renderRecs();
    var by={}, order=[];
    EV.forEach(function(e){if((e.k==='quiz'&&e.v!=='1')||e.k==='game')return; if(!by[e.who]){by[e.who]={n:SHORT[e.who]||e.who,c:0};order.push(by[e.who]);} by[e.who].c++;});
    order.sort(function(a,b){return b.c-a.c;});
    document.getElementById('rank').innerHTML=order.length?'<ol class="rank">'+order.slice(0,6).map(function(p){
      return '<li><span>'+esc(p.n)+'</span><span class="n">'+p.c+(p.c===1?' cura':' cures')+'</span></li>';}).join('')+'</ol>':
      '<p style="margin:0;color:var(--muted)">Encara ningú. Estrena tu el plat.</p>';
    var last=EV.filter(function(e){return !(e.k==='quiz'&&e.v!=='1')&&e.k!=='game';}).slice(-8).reverse();
    document.getElementById('diary').innerHTML=last.length?'<ul class="diary">'+last.map(function(e){
      var w=esc(SHORT[e.who]||e.who), t, ic;
      if(e.k==='feed'){var f=FOOD[e.v]||{n:'alguna cosa',i:''};t=w+' ha donat '+esc(f.n.toLowerCase())+' al Tió.';ic=f.i;}
      else if(e.k==='sing'){t=w+' ha cantat al Tió.';ic=ICONS[1].i;}
      else if(e.k==='tapa'){t=w+' ha tapat el Tió amb la manta a les '+new Date(e.t).toLocaleTimeString('ca-ES',{timeZone:TZ,hour:'2-digit',minute:'2-digit'})+'.';ic='<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 10h28l-2 22H8z" fill="#5b82b8"/><path d="M8 28h24" stroke="#f4efe0" stroke-width="2" stroke-dasharray="3 3"/></svg>';}
      else {t=w+' ha resolt el problema del dia.';ic=ICONS[2].i;}
      return '<li><span style="width:22px;flex:none">'+ic.replace('<svg ','<svg width="22" height="22" ')+'</span><span>'+t+'</span><span class="n">'+ago(e.t)+'</span></li>';}).join('')+'</ul>':
      '<p style="margin:0;color:var(--muted)">El Tió acaba d’arribar a classe i té la panxa a mitges.</p>';
  }

  // Inici
  try{var saved=JSON.parse(lsGet(LS_ME)||'null');}catch(e){saved=null;}
  window.addEventListener('hashchange',function(){hits=0;mode='home';menuSel=-1;render();});
  load().then(function(){
    render();
    if(saved&&saved.name&&saved.code) unlock(saved.name,saved.code).then(function(sec){me=saved;secret=sec;render();syncRecord();},function(){lsSet(LS_ME,'');});
  });
  setInterval(function(){if(eating||singing)return; load().then(render);},30000);
})();
</script>
</body>
</html>
